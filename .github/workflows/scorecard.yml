name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 2'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

# cancel-in-progress FALSE, and the reason is the OPENSSF API PUBLISH specifically -- NOT
# the SARIF upload, which codeql.yml correctly treats as safe to cancel (atomic,
# last-writer-wins; a cancel leaves the prior analysis standing, merely stale). Narrowed
# after INSPECT LOW-2 caught this unit stating opposite verdicts on the same operation in
# two files. The publish is the real differentiator: a cancelled run can leave it partially
# applied, so a superseded run is allowed to finish rather than be killed mid-write.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
