name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 2'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

permissions:
  contents: read

# cancel-in-progress FALSE, and the reason is the OPENSSF API PUBLISH specifically -- NOT
# the SARIF upload, which codeql.yml correctly treats as safe to cancel (atomic,
# last-writer-wins; a cancel leaves the prior analysis standing, merely stale). Narrowed
# after INSPECT LOW-2 caught this unit stating opposite verdicts on the same operation in
# two files. The publish is the real differentiator: a cancelled run can leave it partially
# applied, so a superseded run is allowed to finish rather than be killed mid-write.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10 # measured max 42 s over 8 runs (2026-10-03); ~14x headroom
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
