name: link-check

on:
  # NO paths: filter, r34 MEDIUM 3. r34-FIXBACK2 LOW-4: this comment named "main's ruling" --
  # WRONG. The widening was the HEAD's own call (.claude/orders/r34-fixback.md:38, "MY CALL:
  # WIDEN"); main ruled only that the call BELONGED to the head, a room decision, not a canon
  # change. 29 of this room's 34 in-scope citations point at a NON-markdown target (bin/*.js,
  # lib/*.js, platform-configs/*.json, scripts/*.mjs, LICENSE) -- a `paths: '**.md'` filter
  # cannot fire on the change that breaks most of this gate's own coverage (renaming one of
  # those files breaks a link and changes no .md). Enumerating the target globs instead would
  # be a roster that rots the day a doc cites a new directory. The job runs in seconds and is
  # not a required check (verified at the REST API: the `dependabot-auto-merge-gate` ruleset
  # requires exactly `all-green` + `analyze (javascript)`), so running it on every push/PR
  # costs nothing a filter would have saved.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# cancel-in-progress TRUE (CWK-058, canon: .github/SKILL-REPO-PATTERN.md) -- this workflow
# reads files and publishes nothing, so a superseded run leaves nothing half-done behind.
concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # CWK-120 #4 -- persist-credentials: false. This job never pushes (`contents: read` above), so the
      # checkout token has no use once the checkout completes, and leaving it in .git/config would let the
      # repository code this job runs read it (CoalTipple PR24 #5 made the same call).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # NOT continue-on-error, unlike markdownlint.yml -- a real gate, no report-only pass.
      #
      # ENGINE: scripts/lib/link-check.mjs, this room's own port of the canon DEFAULT
      # (.github/SKILL-REPO-PATTERN.md:91 -- "a small scripts/lib/link-check.mjs walking the
      # repo's own .md files"), never CoalLedger's scripts/lib/md-checks.mjs (that room's own
      # CommonMark+GFM AST, named out of scope for this room by the chief's own order).
      #
      # SCOPE: every TRACKED .md file, excluding `plugin/**` (the GENERATED dist copy --
      # scanning it double-reports every finding the source already caught) and
      # `scripts/fixtures/**` (the engine's OWN test fixtures, which deliberately carry
      # planted defects its unit tests assert against -- scanning them here would fail this
      # gate by design, forever).
      #
      # NEVER continue-on-error, and never wrapped: unlike CoalLedger's own md-checks.mjs
      # (which serves a second consumer and therefore never sets an exit code, forcing its
      # workflow to wrap the bare CLI call in a shell tail-grep -- the exact shape its own
      # head self-caught as a silent always-green no-op before fixing it), this engine has
      # exactly one consumer and sets process.exitCode on findings AT THE SOURCE
      # (scripts/lib/link-check.mjs's own CLI entry). The step below runs it bare and lets
      # its own exit code decide the job -- there is no wrap-and-grep shape to get wrong here.
      #
      # FAILS CLOSED ON AN EMPTY FILE LIST -- the CWK-079 fail-open class this room has now
      # paid for three times (r30, r31 x2): if the `git ls-files | grep -v ... | grep -v ...`
      # chain ever yields nothing (a layout change moves every doc under an excluded prefix),
      # this step exits 1 BEFORE the engine ever runs, rather than reporting a false-clean
      # PASS having scanned nothing. Proven both directions below (RED-PROVE, r33 BUILD
      # return): the real committed tree exits 0; a forced-empty file list exits 1 without
      # reaching the engine at all; scripts/fixtures/defects-links.md alone exits 1 with both
      # planted findings named.
      #
      # CWK-120 #5 -- NUL-DELIMITED ARRAY, not a bare `$files` word-split. `files=$(git ls-files ...)` plus an
      # unquoted `$files` re-split the list on whitespace and glob-expanded it, so a TRACKED path with a space
      # (`docs/User Guide.md`) became two argv entries and a false failure. `git ls-files -z` + `grep -z` +
      # `mapfile -d ''` carries every path through as ONE array element whatever its bytes. mapfile reads from a
      # PROCESS SUBSTITUTION, whose exit status `set -e` does not inspect, so the empty-array guard below is
      # reachable natively (a no-match grep does not abort the script first).
      - run: |
          mapfile -d '' -t files < <(git ls-files -z '*.md' | grep -zv '^plugin/' | grep -zv '^scripts/fixtures/')
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::link-check found NO markdown files to scan -- the scope filter is broken, not the tree"
            exit 1
          fi
          node scripts/lib/link-check.mjs "${files[@]}"
